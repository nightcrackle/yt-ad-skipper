name: Validate extension
 
on:
  push:
  pull_request:
 
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Run validation script
        run: bash scripts/validate.sh